set -a terminal-features "tmux-256color:RGB"
set -g extended-keys on
set -g prefix C-b
set -g base-index 1
set -g renumber-windows on   
set -g mode-keys vi
set -g status-position top
set -g status-justify absolute-centre
set -g status-style "bg=#2B3321,fg=#A4A479"
set -g window-status-current-style "fg=#12150D,bg=#797B53,bold"
set -g window-status-separator ""
set -g window-status-format "#[fg=#6D7053]#[default] #I:#W#{?window_flags,#{window_flags},} #[fg=#6D7053]#[default]"
set -g window-status-current-format "#[fg=#12150D,bg=#797B53,bold] #I:#W#{?window_flags,#{window_flags},} #[default]"
set -g status-interval 5
set -g status-left "#S"
set -g status-right ""
# for debugging
set -g remain-on-exit "off"

bind r source-file "~/.config/tmux/tmux.conf"
bind C-b send-prefix
