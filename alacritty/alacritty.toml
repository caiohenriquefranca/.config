
[shell]
program = "/usr/bin/zsh"

[window]
opacity = 1.0
padding = { x = 8, y = 8 }

[font]
size = 14.0

[font.normal]
family = "NotoMono Nerd Font Mono"
style = "Regular"

# Fundo verde-oliva escuro; a rampa oliva/sepia do tema fica reservada a
# selecao, cursor e ao texto em destaque.
#   #15190F fundo | #A4A479 texto | #797B53 selecao
# As 16 cores ANSI sao uma rampa oliva/sepia derivada da paleta do i3wm.
[colors.primary]
background = "#15190F"
foreground = "#A4A479"

[colors.cursor]
text = "#15190F"
cursor = "#A4A479"

[colors.selection]
text = "#12150D"
background = "#797B53"

[colors.normal]
black   = "#2B3321"
red     = "#784421"
green   = "#797B53"
yellow  = "#C6C396"
blue    = "#5E6750"
magenta = "#9F9F78"
cyan    = "#6D7053"
white   = "#A4A479"

[colors.bright]
black   = "#3D472C"
red     = "#A0723B"
green   = "#939470"
yellow  = "#DBDAD2"
blue    = "#A4A479"
magenta = "#BFBD91"
cyan    = "#888A85"
white   = "#C6C396"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"

[[keyboard.bindings]]
key = "Equals"
mods = "Control"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "Equals"
mods = "Control|Shift"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "NumpadAdd"
mods = "Control|Shift"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "Minus"
mods = "Control"
action = "DecreaseFontSize"

[[keyboard.bindings]]
key = "Minus"
mods = "Control|Shift"
action = "DecreaseFontSize"

[[keyboard.bindings]]
key = "NumpadSubtract"
mods = "Control|Shift"
action = "DecreaseFontSize"


[[keyboard.bindings]]
key = "Key0"
mods = "Control|Alt"
action = "ResetFontSize"
