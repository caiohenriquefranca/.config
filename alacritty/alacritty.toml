
[shell]
program = "/usr/bin/zsh"

[window]
opacity = 0.9
padding = { x = 8, y = 8 }

[font]
size = 10.0

[font.normal]
family = "NotoMono Nerd Font Mono"
style = "Regular"

# Gruvbox Material Dark
[colors.primary]
background = "#282828"
foreground = "#d4be98"

[colors.cursor]
text = "#282828"
cursor = "#d4be98"

[colors.selection]
text = "#282828"
background = "#504945"

[colors.normal]
black   = "#32302f"
red     = "#ea6962"
green   = "#a9b665"
yellow  = "#d8a657"
blue    = "#7daea3"
magenta = "#d3869b"
cyan    = "#89b482"
white   = "#d4be98"

[colors.bright]
black   = "#5a524c"
red     = "#ea6962"
green   = "#a9b665"
yellow  = "#d8a657"
blue    = "#7daea3"
magenta = "#d3869b"
cyan    = "#89b482"
white   = "#ddc7a1"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"