;=============================================================
; Polybar -- Gruvbox Material Dark (estilo dwm / Bread on Penguins)
; tags + titulo da janela a esquerda, scripts de status a direita
;=============================================================

[colors]
; polybar usa #AARRGGBB (alpha PRIMEIRO). Ex: #b33c3836 = 70% de #3c3836
bg      = #b33c3836
bg-alt  = #504945
fg      = #d4be98
dim     = #a89984
green   = #a9b665
yellow  = #d8a657
orange  = #e78a4e
red     = #ea6962
blue    = #7daea3
purple  = #d3869b
aqua    = #89b482

[bar/main]
monitor = ${env:MONITOR:}
width = 60%
height = 26
offset-x = 20%
offset-y = 0
fixed-center = false

background = ${colors.bg}
foreground = ${colors.fg}
line-size = 0
border-size = 0

padding-left = 1
padding-right = 1
module-margin-left = 1
module-margin-right = 1

font-0 = NotoMono Nerd Font Mono:size=10;2
font-1 = Noto Color Emoji:size=10

override-redirect = true

modules-left = i3 xwindow
modules-right = mediaplayer microphone volume bandwidth battery date tray

enable-ipc = true

; barra sem tray para os monitores secundarios
[bar/secondary]
inherit = bar/main
modules-right = mediaplayer microphone volume bandwidth battery date

;=============================================================
; Tags (workspaces) -- ativa clara, inativas verdes
;=============================================================
[module/i3]
type = internal/i3
format = <label-state>
index-sort = true
wrapping-scroll = false
; mostra so os workspaces do proprio monitor (antes exibia workspace de todos os monitores)
pin-workspaces = true

label-focused = %name%
label-focused-foreground = ${colors.fg}
label-focused-background = ${colors.bg}
label-focused-padding = 1

label-unfocused = %name%
label-unfocused-foreground = ${colors.green}
label-unfocused-padding = 1

label-visible = %name%
label-visible-foreground = ${colors.green}
label-visible-padding = 1

label-urgent = %name%
label-urgent-foreground = ${colors.bg}
label-urgent-background = ${colors.red}
label-urgent-padding = 1

;=============================================================
; Titulo da janela focada (ao lado das tags, como no dwm)
;=============================================================
[module/xwindow]
type = custom/script
exec = ~/.config/polybar/appname.sh
interval = 1
format-prefix = " "
label = %output%
label-foreground = ${colors.dim}

;=============================================================
; Status -- reaproveita os scripts do i3blocks
;=============================================================
[module/mediaplayer]
type = custom/script
exec = ~/.config/i3/scripts/mediaplayer
interval = 3
format-prefix = "  "
format-prefix-foreground = ${colors.green}
label-foreground = ${colors.dim}

[module/microphone]
type = custom/script
exec = ~/.config/i3/scripts/microphone
interval = 2
label-foreground = ${colors.purple}

[module/volume]
type = custom/script
exec = ~/.config/i3/scripts/volume
interval = 5
format-prefix = "  "
format-prefix-foreground = ${colors.yellow}
label-foreground = ${colors.dim}

[module/bandwidth]
type = custom/script
exec = ~/.config/i3/scripts/bandwidth
interval = 5
format-prefix = "  "
format-prefix-foreground = ${colors.blue}
label-foreground = ${colors.dim}

[module/battery]
type = custom/script
exec = ~/.config/i3/scripts/battery
interval = 5
format-prefix = "  "
format-prefix-foreground = ${colors.yellow}
label-foreground = ${colors.dim}

[module/date]
type = internal/date
interval = 5
date = %a %b-%d %H:%M
label = "  %date%"
label-foreground = ${colors.dim}

;=============================================================
; Bandeja do sistema (nm-applet, flameshot, etc.)
;=============================================================
[module/tray]
type = internal/tray
format = <tray>
tray-size = 85%
tray-spacing = 6
tray-padding = 2