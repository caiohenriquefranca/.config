;=============================================================
; Polybar -- Mac OS 9 (Platinum)
; menu bar no topo: fundo cinza claro com pinstripes, texto
; preto, selecao em azul Platinum (#336699)
;=============================================================

[colors]
bg      = #DDDDDD
fg      = #000000
dim     = #555555
line    = #888888
blue    = #336699
on-blue = #FFFFFF
red     = #CC0000
white   = #FFFFFF

[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 26
offset-x = 0
offset-y = 0
fixed-center = true

; cor solida Platinum (este build da polybar nao carrega imagem de fundo)
background = ${colors.bg}
foreground = ${colors.fg}
; borda preta embaixo, como a menu bar classica
border-bottom-size = 1
border-bottom-color = ${colors.fg}

line-size = 0
border-size = 0

padding-left = 2
padding-right = 2
module-margin-left = 1
module-margin-right = 1

font-0 = ChicagoFLF:size=11;2
font-1 = NotoMono Nerd Font Mono:size=10;2
font-2 = Noto Color Emoji:size=10

override-redirect = true

modules-left = i3 xwindow
modules-right = mediaplayer microphone volume bandwidth battery date tray

enable-ipc = true

; barra sem tray para os monitores secundarios
[bar/secondary]
inherit = bar/main
modules-right = mediaplayer microphone volume bandwidth battery date

;=============================================================
; Workspaces -- estilo abas/menu: foco em azul Platinum com
; texto branco, inativas com texto preto
;=============================================================
[module/i3]
type = internal/i3
format = <label-state>
index-sort = true
wrapping-scroll = false
pin-workspaces = true

label-focused = %name%
label-focused-foreground = ${colors.on-blue}
label-focused-background = ${colors.blue}
label-focused-padding = 2

label-unfocused = %name%
label-unfocused-foreground = ${colors.fg}
label-unfocused-padding = 2

label-visible = %name%
label-visible-foreground = ${colors.fg}
label-visible-padding = 2

label-urgent = %name%
label-urgent-foreground = ${colors.on-blue}
label-urgent-background = ${colors.red}
label-urgent-padding = 2

;=============================================================
; Titulo da janela focada (ao lado dos workspaces)
;=============================================================
[module/xwindow]
type = custom/script
exec = ~/.config/polybar/appname.sh
interval = 1
format-prefix = "  "
label = %output%
label-maxlen = 50
label-foreground = ${colors.fg}

;=============================================================
; Status -- reaproveita os scripts do i3blocks (preto e cinza,
; sem as cores do gruvbox)
;=============================================================
[module/mediaplayer]
type = custom/script
exec = ~/.config/i3/scripts/mediaplayer
interval = 3
format-prefix = "  "
format-prefix-foreground = ${colors.dim}
label-foreground = ${colors.fg}

[module/microphone]
type = custom/script
exec = ~/.config/i3/scripts/microphone
interval = 2
format-prefix-foreground = ${colors.dim}
label-foreground = ${colors.fg}

[module/volume]
type = custom/script
exec = ~/.config/i3/scripts/volume
interval = 5
format-prefix = "  "
format-prefix-foreground = ${colors.dim}
label-foreground = ${colors.fg}

[module/bandwidth]
type = custom/script
exec = ~/.config/i3/scripts/bandwidth
interval = 5
format-prefix = "  "
format-prefix-foreground = ${colors.dim}
label-foreground = ${colors.fg}

[module/battery]
type = custom/script
exec = ~/.config/i3/scripts/battery
interval = 5
format-prefix = "  "
format-prefix-foreground = ${colors.dim}
label-foreground = ${colors.fg}

[module/date]
type = internal/date
interval = 5
date = %a %d %b  %H:%M
label = "  %date%"
label-foreground = ${colors.fg}

;=============================================================
; Bandeja do sistema (nm-applet, flameshot, etc.)
;=============================================================
[module/tray]
type = internal/tray
format = <tray>
tray-size = 85%
tray-spacing = 6
tray-padding = 2
