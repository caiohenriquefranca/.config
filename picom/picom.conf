# picom.conf — picom v10
# Migrado de um compton.conf antigo (sintaxe compton / picom <= 8).
#
# O que mudou de sintaxe (o picom v10 não conhece mais estas opções):
#   no-dnd-shadow / no-dock-shadow -> wintypes: dnd/dock { shadow = false; }
#   dbe                            -> removida
#   glx-copy-from-front            -> removida
#   alpha-step                     -> removida
#   sw-opti / refresh-rate / glx-use-gpushader4 -> removidas (estavam comentadas)
#   shadow-red/green/blue          -> shadow-color = "#RRGGBB"
# O resto manteve os mesmos valores do arquivo original.

#################################
#             Shadows           #
#################################
shadow = false;
shadow-radius = 12;
shadow-offset-x = -4;
shadow-offset-y = -4;
shadow-opacity = 0.7;
shadow-color = "#000000";
shadow-exclude = [
    "class_g *? = 'bar-0'",
    "class_g = 'Dunst'",
    "class_g = 'conky'",
    "class_g ?= 'Notify-osd'",
    "class_g = 'Cairo-clock'",
    "_GTK_FRAME_EXTENTS@:c"
];

#################################
#   Transparency / Opacity      #
#################################
active-opacity = 0.95;
inactive-opacity = 0.95;
frame-opacity = 1;
inactive-opacity-override = false;

#################################
#             Blur              #
#################################
blur-background = true;
blur-background-frame = true;
blur-background-fixed = true;
# blur-kern ainda é aceito no v10; é o equivalente exato do que já rodava aqui.
blur-kern = "3x3box";
# Alternativa moderna (blur mais forte, dual-filter kawase).
# Para usar, comente a linha blur-kern acima e descomente as duas abaixo:
#   blur-method = "dual_kawase";
#   blur-strength = 5;
blur-background-exclude = [
    "window_type = 'desktop'",
    "_GTK_FRAME_EXTENTS@:c"
];
# Corrige corrupção de linhas causada pelo blur (era resize-damage = 1, comentado).
# resize-damage = 1;

#################################
#        Backend / núcleo       #
#################################
backend = "glx";
vsync = false;
use-damage = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;
# Nvidia + GLX: alguns usuários precisam disso para evitar atraso de conteúdo.
# xrender-sync-fence = false;
# Tuning do GLX (estavam comentados no compton.conf):
# glx-no-stencil = true;
# glx-no-rebind-pixmap = true;

#################################
#      Regras por janela        #
#################################
focus-exclude = [ "class_g = 'Cairo-clock'" ];

# Nautilus 95% / VS Code 95% / Rofi 85% (menor = mais transparente)
opacity-rule = [
    "95:class_g *? = 'Org.gnome.Nautilus'",
    "95:class_g *? = 'code'",
    "85:class_g = 'Rofi'"
];

wintypes: {
    tooltip = { fade = true; shadow = true; opacity = 0.75; focus = true; };
    dock = { shadow = false; };
    dnd = { shadow = false; };
};

log-level = "warn";
